apiVersion: v1
kind: Service
metadata:
  name: sip-calculator
  labels:
    app: sip_calculator
spec:
  type: NodePort
  selector:
    app: sip_calculator        # must match your Deployment/Pod labels
  ports:
    - name: http
      protocol: TCP
      port: 5000         # service port
      targetPort: 5000 # container port
      nodePort: 30080  # node port (must be in cluster's NodePort range)
